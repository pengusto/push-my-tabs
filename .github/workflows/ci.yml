name: CI

on:
  push:
  pull_request:

jobs:
  chrome-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: ./scripts/build-chrome.sh

  firefox-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: ./scripts/build-firefox.sh
