<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="extensionName">Push My Tabs</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup">
    <header class="brand">
      <img class="brand-mark" src="assets/icons/icon-32.png" alt="">
      <strong>Push My Tabs</strong>
    </header>

    <p id="detected" class="layout-status" data-i18n="layoutDetecting">Detecting layout…</p>

    <section id="layout-confirmation" class="layout-choice" aria-live="polite" hidden>
      <p id="layout-confirmation-text"></p>
      <div>
        <button type="button" data-layout="recommended"></button>
        <button type="button" data-layout="vertical" data-i18n="layoutVertical">Vertical</button>
        <button type="button" data-layout="horizontal" data-i18n="layoutHorizontal">Horizontal</button>
      </div>
    </section>

    <label>
      <span>↔️ <span data-i18n="layoutModeLabel">Layout mode</span></span>
      <select id="layout-mode">
        <option value="auto" data-icon="✦" data-i18n="layoutAuto">Automatic</option>
        <option value="horizontal" data-icon="↔" data-i18n="layoutHorizontal">Horizontal</option>
        <option value="vertical" data-icon="↕" data-i18n="layoutVertical">Vertical</option>
      </select>
    </label>

    <section id="site-learning" class="site-learning" hidden>
      <p id="site-learning-copy"></p>
      <div class="site-scope" data-scope="origin">
        <button id="remember-site" type="button"></button>
        <div class="site-profile-edit" hidden>
          <span class="site-profile-label"></span>
          <select class="icon-select" aria-label="Site layout">
            <option value="horizontal">↔</option>
            <option value="vertical">↕</option>
          </select>
          <button class="remove-profile" type="button">×</button>
        </div>
      </div>
      <div class="site-scope" data-scope="path">
        <button id="remember-path" type="button" data-i18n="rememberPath">Only this path</button>
        <div class="site-profile-edit" hidden>
          <span class="site-profile-label"></span>
          <select class="icon-select" aria-label="Path layout">
            <option value="horizontal">↔</option>
            <option value="vertical">↕</option>
          </select>
          <button class="remove-profile" type="button">×</button>
        </div>
      </div>
    </section>

    <label>
      <span>⌨️ <span data-i18n="presetLabel">Shortcut preset</span></span>
      <select id="preset">
        <option value="adaptive" data-icon="✦" data-i18n="presetAdaptive">Follow layout</option>
        <option value="horizontal" data-icon="↔" data-i18n="presetHorizontal">Always horizontal</option>
        <option value="vertical" data-icon="↕" data-i18n="presetVertical">Always vertical</option>
        <option value="custom" data-icon="⚙" data-i18n="presetCustom">Custom</option>
      </select>
    </label>

    <section class="mapping-preview" aria-label="Current key mapping" data-i18n-aria-label="currentMappingAriaLabel">
      <p data-i18n="currentMapping">Current mapping</p>
      <div id="mapping-preview"></div>
    </section>

    <button id="options" class="secondary" data-i18n="moreSettings">More settings</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
